<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CampusAI 3D Hologram</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07090E;
      background: radial-gradient(circle at 50% 45%, #0F192E 0%, #080D1A 60%, #04060A 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    .hud-overlay {
      position: absolute;
      top: 12px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 9999px;
      background: rgba(13, 27, 42, 0.7);
      border: 1px solid rgba(0, 240, 255, 0.3);
      backdrop-filter: blur(8px);
      color: #00F0FF;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
      transition: all 0.3s ease;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00F0FF;
      box-shadow: 0 0 8px #00F0FF;
      animation: pulse 1.8s infinite;
    }
    .status-badge.listening {
      border-color: rgba(236, 72, 153, 0.5);
      color: #F472B6;
      box-shadow: 0 0 18px rgba(236, 72, 153, 0.3);
    }
    .status-badge.listening .status-dot {
      background: #F472B6;
      box-shadow: 0 0 10px #F472B6;
    }
    .status-badge.thinking {
      border-color: rgba(251, 191, 36, 0.5);
      color: #FBBF24;
      box-shadow: 0 0 18px rgba(251, 191, 36, 0.3);
    }
    .status-badge.thinking .status-dot {
      background: #FBBF24;
      box-shadow: 0 0 10px #FBBF24;
    }
    .status-badge.speaking {
      border-color: rgba(52, 211, 153, 0.5);
      color: #34D399;
      box-shadow: 0 0 18px rgba(52, 211, 153, 0.3);
    }
    .status-badge.speaking .status-dot {
      background: #34D399;
      box-shadow: 0 0 10px #34D399;
    }
    .hud-grid {
      position: absolute;
      bottom: 10px;
      left: 14px;
      color: rgba(0, 240, 255, 0.4);
      font-size: 10px;
      font-family: monospace;
      letter-spacing: 0.1em;
      pointer-events: none;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
  </style>
</head>
<body>
  <div class="hud-overlay">
    <div id="statusBadge" class="status-badge">
      <span class="status-dot"></span>
      <span id="statusText">AI ONLINE</span>
    </div>
    <div style="font-family: monospace; font-size: 10px; color: rgba(148, 163, 184, 0.6);">
      CAMPUS·AI v2.6
    </div>
  </div>

  <div class="hud-grid" id="fpsDisplay">
    NEURAL CORE: ACTIVE // 60 FPS
  </div>

  <div id="canvas-container"></div>

  <!-- Three.js CDN with graceful fallback -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // State Management
    let currentState = 'idle'; // 'idle', 'listening', 'thinking', 'speaking'
    let stateIntensity = 1.0;
    let targetRotationX = 0;
    let targetRotationY = 0;

    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');

    window.setAvatarState = function(state) {
      currentState = state || 'idle';
      statusBadge.className = 'status-badge ' + currentState;
      if (currentState === 'listening') {
        statusText.innerText = 'LISTENING...';
      } else if (currentState === 'thinking') {
        statusText.innerText = 'ANALYZING QUERY...';
      } else if (currentState === 'speaking') {
        statusText.innerText = 'SYNTHESIZING...';
      } else {
        statusText.innerText = 'CAMPUS AI READY';
      }
    };

    // Check if Three.js loaded, else fallback to 2D/3D Canvas wireframe
    if (typeof THREE !== 'undefined') {
      initThreeJS();
    } else {
      initCanvasFallback();
    }

    function initThreeJS() {
      const container = document.getElementById('canvas-container');
      const width = container.clientWidth || window.innerWidth;
      const height = container.clientHeight || window.innerHeight;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      camera.position.z = 4.8;
      camera.position.y = 0.2;

      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Master Group
      const avatarGroup = new THREE.Group();
      scene.add(avatarGroup);

      // Core Holographic Head Sphere (Faceted Cyber Core)
      const headGeometry = new THREE.IcosahedronGeometry(0.85, 2);
      const headMaterial = new THREE.MeshPhongMaterial({
        color: 0x00F0FF,
        emissive: 0x003855,
        wireframe: true,
        transparent: true,
        opacity: 0.85
      });
      const headMesh = new THREE.Mesh(headGeometry, headMaterial);
      avatarGroup.add(headMesh);

      // Inner Core Glow Sphere
      const innerCoreGeo = new THREE.SphereGeometry(0.55, 16, 16);
      const innerCoreMat = new THREE.MeshBasicMaterial({
        color: 0x00D8F6,
        transparent: true,
        opacity: 0.4
      });
      const innerCoreMesh = new THREE.Mesh(innerCoreGeo, innerCoreMat);
      avatarGroup.add(innerCoreMesh);

      // Digital Cyber Eyes
      const eyeGeo = new THREE.BoxGeometry(0.2, 0.08, 0.05);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x38BDF8 });
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(-0.32, 0.18, 0.78);
      avatarGroup.add(leftEye);

      const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
      rightEye.position.set(0.32, 0.18, 0.78);
      avatarGroup.add(rightEye);

      // Mouth Visualizer Equalizer bars
      const mouthBars = [];
      const barCount = 5;
      for (let i = 0; i < barCount; i++) {
        const barGeo = new THREE.BoxGeometry(0.06, 0.08, 0.04);
        const barMat = new THREE.MeshBasicMaterial({ color: 0x00F0FF });
        const bar = new THREE.Mesh(barGeo, barMat);
        const offsetX = (i - 2) * 0.09;
        bar.position.set(offsetX, -0.28, 0.76);
        avatarGroup.add(bar);
        mouthBars.push(bar);
      }

      // Orbital Gyro Rings
      const ringGeo1 = new THREE.TorusGeometry(1.28, 0.018, 8, 48);
      const ringMat1 = new THREE.MeshBasicMaterial({ color: 0x00F0FF, transparent: true, opacity: 0.65 });
      const ring1 = new THREE.Mesh(ringGeo1, ringMat1);
      avatarGroup.add(ring1);

      const ringGeo2 = new THREE.TorusGeometry(1.5, 0.015, 8, 48);
      const ringMat2 = new THREE.MeshBasicMaterial({ color: 0x818CF8, transparent: true, opacity: 0.5 });
      const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
      ring2.rotation.x = Math.PI / 3;
      avatarGroup.add(ring2);

      const ringGeo3 = new THREE.TorusGeometry(1.7, 0.012, 8, 48);
      const ringMat3 = new THREE.MeshBasicMaterial({ color: 0x38BDF8, transparent: true, opacity: 0.35 });
      const ring3 = new THREE.Mesh(ringGeo3, ringMat3);
      ring3.rotation.y = Math.PI / 4;
      avatarGroup.add(ring3);

      // Ambient Floating Particles
      const particleCount = 70;
      const particleGeo = new THREE.BufferGeometry();
      const posArray = new Float32Array(particleCount * 3);
      for (let i = 0; i < particleCount * 3; i += 3) {
        posArray[i] = (Math.random() - 0.5) * 5;
        posArray[i + 1] = (Math.random() - 0.5) * 4;
        posArray[i + 2] = (Math.random() - 0.5) * 4;
      }
      particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      const particleMat = new THREE.PointsMaterial({
        size: 0.04,
        color: 0x00F0FF,
        transparent: true,
        opacity: 0.6
      });
      const particles = new THREE.Points(particleGeo, particleMat);
      scene.add(particles);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0x0a192f, 2.0);
      scene.add(ambientLight);

      const pointLight = new THREE.PointLight(0x00F0FF, 3, 10);
      pointLight.position.set(2, 3, 4);
      scene.add(pointLight);

      const secondaryLight = new THREE.PointLight(0x818CF8, 2, 10);
      secondaryLight.position.set(-3, -2, 2);
      scene.add(secondaryLight);

      // Touch / Mouse Tracking
      window.addEventListener('pointermove', (e) => {
        const nx = (e.clientX / window.innerWidth) * 2 - 1;
        const ny = -(e.clientY / window.innerHeight) * 2 + 1;
        targetRotationY = nx * 0.45;
        targetRotationX = -ny * 0.35;
      });

      window.addEventListener('resize', () => {
        const nw = container.clientWidth || window.innerWidth;
        const nh = container.clientHeight || window.innerHeight;
        camera.aspect = nw / nh;
        camera.updateProjectionMatrix();
        renderer.setSize(nw, nh);
      });

      // Animation Loop
      let clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();

        // Levitation & Floating
        avatarGroup.position.y = Math.sin(time * 1.5) * 0.08;

        // Smooth Look Towards Target
        avatarGroup.rotation.y += (targetRotationY - avatarGroup.rotation.y) * 0.05;
        avatarGroup.rotation.x += (targetRotationX - avatarGroup.rotation.x) * 0.05;

        // Dynamic State Transitions
        if (currentState === 'idle') {
          ring1.rotation.z += 0.008;
          ring2.rotation.x += 0.006;
          ring3.rotation.y += 0.005;
          headMaterial.color.setHex(0x00F0FF);
          headMaterial.emissive.setHex(0x003855);
          innerCoreMat.color.setHex(0x00D8F6);
          eyeMat.color.setHex(0x38BDF8);

          // Reset mouth bars
          for (let i = 0; i < mouthBars.length; i++) {
            mouthBars[i].scale.y = 1.0;
          }
        } else if (currentState === 'listening') {
          // Listening pulse
          const pulse = 1 + Math.sin(time * 6) * 0.08;
          innerCoreMesh.scale.set(pulse, pulse, pulse);
          ring1.rotation.z += 0.015;
          ring2.rotation.x += 0.018;
          ring3.rotation.y += 0.012;
          headMaterial.color.setHex(0xF472B6);
          headMaterial.emissive.setHex(0x4A0E2E);
          innerCoreMat.color.setHex(0xEC4899);
          eyeMat.color.setHex(0xF472B6);
        } else if (currentState === 'thinking') {
          // Rapid spin & analytical pulse
          ring1.rotation.z += 0.045;
          ring2.rotation.x += 0.04;
          ring3.rotation.y += 0.035;
          headMaterial.color.setHex(0xFBBF24);
          headMaterial.emissive.setHex(0x452B00);
          innerCoreMat.color.setHex(0xF59E0B);
          eyeMat.color.setHex(0xFCD34D);

          const spin = Math.sin(time * 8) * 0.15;
          headMesh.rotation.y = spin;
        } else if (currentState === 'speaking') {
          // Speaking equalizer audio waveform
          ring1.rotation.z += 0.018;
          ring2.rotation.x += 0.015;
          ring3.rotation.y += 0.012;
          headMaterial.color.setHex(0x34D399);
          headMaterial.emissive.setHex(0x064E3B);
          innerCoreMat.color.setHex(0x10B981);
          eyeMat.color.setHex(0x6EE7B7);

          // Animate mouth bars
          for (let i = 0; i < mouthBars.length; i++) {
            const freq = Math.abs(Math.sin(time * 12 + i * 1.5)) * 2.8 + 0.5;
            mouthBars[i].scale.y = freq;
          }
        }

        // Rotate ambient particles
        particles.rotation.y = time * 0.05;

        renderer.render(scene, camera);
      }
      animate();
    }

    // Fallback Canvas 3D renderer if external Three.js is blocked
    function initCanvasFallback() {
      const container = document.getElementById('canvas-container');
      const canvas = document.createElement('canvas');
      canvas.width = container.clientWidth || window.innerWidth;
      canvas.height = container.clientHeight || window.innerHeight;
      container.appendChild(canvas);
      const ctx = canvas.getContext('2d');

      let angle = 0;
      function render() {
        requestAnimationFrame(render);
        angle += (currentState === 'thinking' ? 0.06 : (currentState === 'speaking' ? 0.035 : 0.015));

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cx = canvas.width / 2;
        const cy = canvas.height / 2 + Math.sin(angle * 2) * 12;

        let primaryColor = '#00F0FF';
        if (currentState === 'listening') primaryColor = '#F472B6';
        if (currentState === 'thinking') primaryColor = '#FBBF24';
        if (currentState === 'speaking') primaryColor = '#34D399';

        // Outer Rings
        ctx.save();
        ctx.translate(cx, cy);
        for (let r = 0; r < 3; r++) {
          ctx.beginPath();
          ctx.ellipse(0, 0, 95 + r * 25, 45 + r * 15, angle + r * (Math.PI / 3), 0, Math.PI * 2);
          ctx.strokeStyle = primaryColor;
          ctx.lineWidth = 1.8;
          ctx.globalAlpha = 0.45 - r * 0.1;
          ctx.stroke();
        }

        // Hologram Core Sphere
        ctx.beginPath();
        ctx.arc(0, 0, 52, 0, Math.PI * 2);
        const radGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, 52);
        radGrad.addColorStop(0, primaryColor);
        radGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = radGrad;
        ctx.globalAlpha = 0.35;
        ctx.fill();

        // Cyber Eyes
        ctx.fillStyle = primaryColor;
        ctx.globalAlpha = 0.9;
        ctx.fillRect(-22, -10, 16, 6);
        ctx.fillRect(6, -10, 16, 6);

        // Mouth Equalizer
        for (let i = 0; i < 5; i++) {
          const h = currentState === 'speaking' ? (Math.abs(Math.sin(angle * 8 + i)) * 18 + 4) : 4;
          ctx.fillRect(-16 + i * 8, 16 - h / 2, 4, h);
        }
        ctx.restore();
      }
      render();
    }
  </script>
</body>
</html>
